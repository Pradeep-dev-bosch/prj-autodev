[project]
name = "gerritmcpserver"
version = "0.1.0"
description = "MCP server for Gerrit Code Review REST API integration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
